name: Steam qualified game content enrichment

on:
  repository_dispatch:
    types: [steam_game_qualified, steam_game_refresh, steam_game_twitch_discovered]
  workflow_dispatch:
    inputs:
      appid:
        description: Steam AppID
        required: true
        type: string
      official_followers:
        description: Verified Steam Community memberCount
        required: true
        type: string
      release_date:
        description: Exact Taiwan release date YYYY-MM-DD
        required: true
        type: string
      official_checked_at_taipei:
        description: Optional official Followers verification timestamp
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: steam-content-enrichment-${{ github.event.client_payload.appid || inputs.appid }}
  cancel-in-progress: false

jobs:
  enrich-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APPID: ${{ github.event.client_payload.appid || inputs.appid }}
      OFFICIAL_FOLLOWERS: ${{ github.event_name == 'repository_dispatch' && (toJSON(github.event.client_payload.official_followers) == 'null' && 'null' || format('{0}', github.event.client_payload.official_followers)) || inputs.official_followers }}
      RELEASE_DATE: ${{ github.event.client_payload.release_date || inputs.release_date }}
      OFFICIAL_CHECKED_AT_TAIPEI: ${{ github.event.client_payload.official_checked_at_taipei || inputs.official_checked_at_taipei }}
      EVENT_ACTION: ${{ github.event.action }}
      TWITCH_ADMISSION_JSON: ${{ toJSON(github.event.client_payload.twitch_admission) }}
      TWITCH_ADMISSION_PATH: twitch-admission.json
      FOLLOWER_STATUS: ${{ github.event.client_payload.follower_status }}
      FOLLOWER_UNAVAILABLE_AT: ${{ github.event.client_payload.follower_unavailable_at }}
      FOLLOWER_STATE_JSON: ${{ toJSON(github.event.client_payload) }}

    steps:
      - name: Checkout independent content backend code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            content_backend/
            requirements-core.txt
            .github/workflows/steam-content-enrichment-dispatch.yml
            .github/workflows/steam-catalog-reconcile.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install content backend dependencies
        run: python -m pip install --disable-pip-version-check -r content_backend/requirements.txt

      - name: Validate qualified-game event
        run: |
          python - <<'PY'
          import json,os,re,sys
          from datetime import date
          from pathlib import Path
          sys.path.insert(0,"content_backend")
          from urllib.request import urlopen
          from twitch_steam_admission import normalize_twitch_admission, validate_twitch_snapshot
          from radar_core.domain.twitch_admission import has_unavailable_group_followers
          appid=os.environ.get("APPID","")
          followers=os.environ.get("OFFICIAL_FOLLOWERS","")
          release=os.environ.get("RELEASE_DATE","")
          assert appid.isdigit() and int(appid)>0, appid
          raw = json.loads(os.environ.get("TWITCH_ADMISSION_JSON") or "null")
          proof = normalize_twitch_admission(raw, appid)
          assert raw is None or proof is not None, "Invalid Twitch admission proof"
          assert os.environ.get("EVENT_ACTION") != "steam_game_twitch_discovered" or proof is not None
          if followers == "null":
              event = json.loads(os.environ.get("FOLLOWER_STATE_JSON") or "{}")
              assert isinstance(event, dict), "Invalid unavailable Followers event"
              candidate = {**event, "appid": int(appid), "followers": None,
                           "follower_checked_at": os.environ.get("OFFICIAL_CHECKED_AT_TAIPEI") or None,
                           "follower_status": os.environ.get("FOLLOWER_STATUS"),
                           "follower_unavailable_at": os.environ.get("FOLLOWER_UNAVAILABLE_AT"),
                           "twitch_admission": proof}
              assert proof is not None and has_unavailable_group_followers(candidate), "Invalid missing GroupID evidence"
          else:
              assert followers.isdigit() and (int(followers)>=5000 or proof is not None), followers
          assert re.fullmatch(r"\d{4}-\d{2}-\d{2}", release) and date.fromisoformat(release), release
          if proof is not None:
              base = "https://raw.githubusercontent.com/danielet087/game-trend-radar/" + proof["source_frontend_commit"] + "/data/"
              with urlopen(base + "twitch_tracking.json", timeout=30) as response:
                  registry = json.load(response)
              with urlopen(base + "twitch_steam_discovery.json", timeout=30) as response:
                  discovery = json.load(response)
              assert validate_twitch_snapshot(proof, registry, discovery), "Twitch admission source snapshot does not match"
              Path(os.environ["TWITCH_ADMISSION_PATH"]).write_text(json.dumps(proof), encoding="utf-8")
          print("CONTENT_EVENT_VALID", appid, followers, release, "twitch_source", proof is not None)
          PY

      - name: Run offline content tests
        run: |
          python -m py_compile content_backend/enrich_game.py
          PYTHONPATH=content_backend python -m unittest discover -s content_backend -p "test_*.py" -q

      - name: Checkout public frontend with write token
        env:
          GH_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::FRONTEND_REPO_TOKEN is missing"
            exit 1
          fi
          gh auth setup-git
          gh repo clone danielet087/game-trend-radar frontend -- --depth 1

      - name: Validate catalog before collection writes
        run: PYTHONPATH=content_backend python -m radar_backend.jobs.publish_content validate --frontend frontend

      - name: Enrich one qualified game from Steam and upsert public JSON
        env:
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          FORCE_ARG=""
          if [ "$EVENT_ACTION" = "steam_game_refresh" ]; then
            FORCE_ARG="--force"
          fi
          ADMISSION_ARGS=()
          if [ -f "$TWITCH_ADMISSION_PATH" ]; then
            ADMISSION_ARGS=(--twitch-admission "$TWITCH_ADMISSION_PATH")
          fi
          FOLLOWER_ARGS=()
          if [ "$OFFICIAL_FOLLOWERS" = "null" ]; then
            FOLLOWER_ARGS=(--follower-status "$FOLLOWER_STATUS" --follower-unavailable-at "$FOLLOWER_UNAVAILABLE_AT")
          fi
          python content_backend/enrich_game.py \
            --appid "$APPID" \
            --followers "$OFFICIAL_FOLLOWERS" \
            --release-date "$RELEASE_DATE" \
            --follower-checked-at "$OFFICIAL_CHECKED_AT_TAIPEI" \
            --data-dir frontend/data \
            "${ADMISSION_ARGS[@]}" "${FOLLOWER_ARGS[@]}" $FORCE_ARG

      - name: Freeze validated game for publication
        run: |
          FORCE_ARGS=()
          if [ "$EVENT_ACTION" = "steam_game_refresh" ]; then
            FORCE_ARGS=(--force)
          fi
          PYTHONPATH=content_backend python -m radar_backend.jobs.publish_content freeze-enrichment \
            --frontend frontend --appid "$APPID" --followers "$OFFICIAL_FOLLOWERS" \
            --release-date "$RELEASE_DATE" "${FORCE_ARGS[@]}" \
            --output "$RUNNER_TEMP/steam-content-batch.json"

      - name: Publish frozen content against latest frontend
        env:
          GH_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
        run: |
          PYTHONPATH=content_backend python -m radar_backend.jobs.publish_content publish \
            --frontend frontend --frozen "$RUNNER_TEMP/steam-content-batch.json" \
            --receipt "$RUNNER_TEMP/steam-content-publication.json"

      - name: Preserve publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steam-content-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/steam-content-publication.json
          if-no-files-found: ignore
          retention-days: 7
