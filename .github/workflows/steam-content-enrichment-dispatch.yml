name: Steam qualified game content enrichment

on:
  repository_dispatch:
    types: [steam_game_qualified, steam_game_refresh, steam_game_twitch_discovered]
  workflow_dispatch:
    inputs:
      appid:
        description: Steam AppID
        required: true
        type: string
      official_followers:
        description: Verified Steam Community memberCount
        required: true
        type: string
      release_date:
        description: Exact Taiwan release date YYYY-MM-DD
        required: true
        type: string
      official_checked_at_taipei:
        description: Optional official Followers verification timestamp
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: steam-content-enrichment-${{ github.event.client_payload.appid || inputs.appid }}
  cancel-in-progress: false

jobs:
  enrich-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APPID: ${{ github.event.client_payload.appid || inputs.appid }}
      OFFICIAL_FOLLOWERS: ${{ github.event.client_payload.official_followers != null && format('{0}', github.event.client_payload.official_followers) || inputs.official_followers }}
      RELEASE_DATE: ${{ github.event.client_payload.release_date || inputs.release_date }}
      OFFICIAL_CHECKED_AT_TAIPEI: ${{ github.event.client_payload.official_checked_at_taipei || inputs.official_checked_at_taipei }}
      EVENT_ACTION: ${{ github.event.action }}
      TWITCH_ADMISSION_JSON: ${{ toJSON(github.event.client_payload.twitch_admission) }}
      TWITCH_ADMISSION_PATH: twitch-admission.json

    steps:
      - name: Checkout independent content backend code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            content_backend/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Validate qualified-game event
        run: |
          python - <<'PY'
          import json,os,re,sys
          from datetime import date
          from pathlib import Path
          sys.path.insert(0,"content_backend")
          from urllib.request import urlopen
          from twitch_steam_admission import normalize_twitch_admission, validate_twitch_snapshot
          appid=os.environ.get("APPID","")
          followers=os.environ.get("OFFICIAL_FOLLOWERS","")
          release=os.environ.get("RELEASE_DATE","")
          assert appid.isdigit() and int(appid)>0, appid
          raw = json.loads(os.environ.get("TWITCH_ADMISSION_JSON") or "null")
          proof = normalize_twitch_admission(raw, appid)
          assert raw is None or proof is not None, "Invalid Twitch admission proof"
          assert os.environ.get("EVENT_ACTION") != "steam_game_twitch_discovered" or proof is not None
          assert followers.isdigit() and (int(followers)>=5000 or proof is not None), followers
          assert re.fullmatch(r"\d{4}-\d{2}-\d{2}", release) and date.fromisoformat(release), release
          if proof is not None:
              base = "https://raw.githubusercontent.com/danielet087/game-trend-radar/" + proof["source_frontend_commit"] + "/data/"
              with urlopen(base + "twitch_tracking.json", timeout=30) as response:
                  registry = json.load(response)
              with urlopen(base + "twitch_steam_discovery.json", timeout=30) as response:
                  discovery = json.load(response)
              assert validate_twitch_snapshot(proof, registry, discovery), "Twitch admission source snapshot does not match"
              Path(os.environ["TWITCH_ADMISSION_PATH"]).write_text(json.dumps(proof), encoding="utf-8")
          print("CONTENT_EVENT_VALID", appid, followers, release, "twitch_source", proof is not None)
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install content backend dependencies and run offline tests
        run: |
          python -m pip install --disable-pip-version-check -r content_backend/requirements.txt
          python -m py_compile content_backend/enrich_game.py
          PYTHONPATH=content_backend python -m unittest discover -s content_backend -p "test_*.py" -q

      - name: Checkout public frontend with write token
        env:
          GH_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::FRONTEND_REPO_TOKEN is missing"
            exit 1
          fi
          gh auth setup-git
          gh repo clone danielet087/game-trend-radar frontend -- --depth 1

      - name: Enrich one qualified game from Steam and upsert public JSON
        env:
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          FORCE_ARG=""
          if [ "$EVENT_ACTION" = "steam_game_refresh" ]; then
            FORCE_ARG="--force"
          fi
          ADMISSION_ARGS=()
          if [ -f "$TWITCH_ADMISSION_PATH" ]; then
            ADMISSION_ARGS=(--twitch-admission "$TWITCH_ADMISSION_PATH")
          fi
          python content_backend/enrich_game.py \
            --appid "$APPID" \
            --followers "$OFFICIAL_FOLLOWERS" \
            --release-date "$RELEASE_DATE" \
            --follower-checked-at "$OFFICIAL_CHECKED_AT_TAIPEI" \
            --data-dir frontend/data \
            "${ADMISSION_ARGS[@]}" $FORCE_ARG

      - name: Validate public contract before publishing
        run: |
          python - <<'PY'
          import json,os,re,sys
          from pathlib import Path
          sys.path.insert(0,"content_backend")
          from twitch_steam_admission import is_twitch_qualified
          aid=int(os.environ["APPID"])
          p=Path(f"frontend/data/games/{aid}.json")
          row=json.loads(p.read_text(encoding="utf-8"))
          assert int(row.get("appid",-1))==aid
          assert int(row["followers"])>=5000 or is_twitch_qualified(row)
          assert row.get("release_display_precision")=="date_full"
          assert row.get("release_precision")=="day"
          assert row.get("release_date_timezone")=="Asia/Taipei"
          assert row.get("sexual_content_screened") is True
          assert row.get("header_image") or row.get("main_capsule_image")
          assert isinstance(row.get("language_support"),dict)
          assert isinstance(row.get("tags"),list)
          assert isinstance(row.get("genres"),list)
          assert re.fullmatch(r"\d{4}-\d{2}-\d{2}", str(row.get("release_start","")))
          month=Path(f"frontend/data/calendar/{row['release_start'][:7]}.json")
          month_doc=json.loads(month.read_text(encoding="utf-8"))
          assert any(int(x.get("appid",-1))==aid for x in month_doc.get("games",[]))
          print("PUBLIC_CONTENT_VALID",aid,
                "tags",len(row["tags"]),"genres",len(row["genres"]))
          PY

      # The record is fetched from Steam ONCE. Publish retries must only merge
      # that verified game's record into the newest public JSON, never replay a
      # stale full-file commit over another concurrently enriched game.
      - name: Cache validated game record for conflict-safe publishing
        env:
          RECORD_PATH: ${{ runner.temp }}/steam-enriched-record.json
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          appid = int(os.environ["APPID"])
          record = json.loads(
              Path(f"frontend/data/games/{appid}.json").read_text(encoding="utf-8")
          )
          assert int(record.get("appid", -1)) == appid
          assert int(record["followers"]) == int(os.environ["OFFICIAL_FOLLOWERS"])
          assert record.get("content_enrichment_signature") == (
              f"{appid}:{record['followers']}:{record['release_start']}"
          )
          cache = {
              "appid": appid,
              "followers": int(os.environ["OFFICIAL_FOLLOWERS"]),
              "release_date": record["release_start"],
              "event_release_date": os.environ["RELEASE_DATE"],
              "force": os.environ.get("EVENT_ACTION") == "steam_game_refresh",
              "record": record,
          }
          Path(os.environ["RECORD_PATH"]).write_text(
              json.dumps(cache, ensure_ascii=False), encoding="utf-8"
          )
          print("CONTENT_RECORD_CACHED", appid, flush=True)
          PY

      - name: Publish enriched Steam game to frontend with conflict-safe retries
        env:
          GH_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
          RECORD_PATH: ${{ runner.temp }}/steam-enriched-record.json
        run: |
          set -euo pipefail
          git -C frontend config user.name "github-actions[bot]"
          git -C frontend config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Each competing job may publish to the same JSON. Do not serialize the
          # whole workflow: GitHub concurrency only keeps one pending run, which
          # would silently discard other AppID events. Retry optimistic updates.
          for attempt in $(seq 1 12); do
            echo "CONTENT_PUBLISH_ATTEMPT AppID=$APPID attempt=$attempt/12"
            git -C frontend fetch origin main
            git -C frontend reset --hard origin/main
            # Git reset keeps untracked AppID files. Remove generated leftovers
            # so the cached verified record rebuilds every dependent index.
            git -C frontend clean -fd -- data/games data/calendar data/lists

            PYTHONPATH=content_backend python - <<'PY'
          import json, os, re
          from pathlib import Path
          from enrich_game import upsert_sharded
          from twitch_steam_admission import is_twitch_qualified

          cache = json.loads(Path(os.environ["RECORD_PATH"]).read_text(encoding="utf-8"))
          appid = int(os.environ["APPID"])
          assert cache["appid"] == appid
          assert cache["followers"] == int(os.environ["OFFICIAL_FOLLOWERS"])
          assert cache["event_release_date"] == os.environ["RELEASE_DATE"]
          record = cache["record"]
          assert int(record["appid"]) == appid
          assert int(record["followers"]) == cache["followers"]
          data_dir = Path("frontend/data")
          changed = upsert_sharded(
              data_dir, record, cache["release_date"], force=cache["force"]
          )
          row = json.loads(
              (data_dir / "games" / f"{appid}.json").read_text(encoding="utf-8")
          )
          assert int(row.get("appid", -1)) == appid
          assert int(row["followers"])>=5000 or is_twitch_qualified(row)
          assert row.get("content_enrichment_signature") == (
              f"{appid}:{cache['followers']}:{row['release_start']}"
          )
          assert row.get("release_precision") == "day"
          assert row.get("release_display_precision") == "date_full"
          assert row.get("release_date_timezone") == "Asia/Taipei"
          assert row.get("sexual_content_screened") is True
          assert row.get("header_image") or row.get("main_capsule_image")
          assert isinstance(row.get("language_support"), dict)
          assert isinstance(row.get("tags"), list)
          assert isinstance(row.get("genres"), list)
          assert re.fullmatch(r"\d{4}-\d{2}-\d{2}", str(row.get("release_start", "")))
          month = json.loads((data_dir / "calendar" / f"{row['release_start'][:7]}.json").read_text(encoding="utf-8"))
          index = json.loads((data_dir / "index.json").read_text(encoding="utf-8"))
          legacy = json.loads((data_dir / "steam_upcoming.json").read_text(encoding="utf-8"))
          upcoming = json.loads((data_dir / "lists" / "upcoming.json").read_text(encoding="utf-8"))
          assert any(int(x["appid"]) == appid for x in month["games"]), "AppID missing from month"
          assert any(int(x["appid"]) == appid for x in legacy["games"]), "AppID missing from legacy"
          assert row["release_start"][:7] in index["months"], "month missing from index"
          assert index["game_count"] == legacy["count"] == len(legacy["games"]), "catalog count mismatch"
          from datetime import datetime
          from zoneinfo import ZoneInfo
          if row["release_start"] >= datetime.now(ZoneInfo("Asia/Taipei")).date().isoformat():
              assert appid in upcoming["appids"], "AppID missing from upcoming"
          print("CONTENT_LATEST_MERGE_VALID", appid, "changed", changed, flush=True)
          PY

            git -C frontend add "data/games/$APPID.json" data/calendar data/index.json data/lists data/steam_upcoming.json data/catalog.json
            if git -C frontend diff --cached --quiet; then
              echo "CONTENT_ALREADY_CURRENT AppID=$APPID"
              exit 0
            fi

            git -C frontend commit -m "data: enrich Steam AppID shard $APPID [skip ci]"
            if git -C frontend push origin HEAD:main; then
              echo "CONTENT_PUBLISHED AppID=$APPID Followers=$OFFICIAL_FOLLOWERS attempt=$attempt"
              exit 0
            fi

            echo "::warning::Concurrent public JSON update, retrying AppID=$APPID attempt=$attempt/12"
            if [ "$attempt" -lt 12 ]; then
              sleep $((2 + attempt + RANDOM % 5))
            fi
          done
          echo "::error::Could not publish AppID=$APPID after 12 conflict-safe attempts"
          exit 1
