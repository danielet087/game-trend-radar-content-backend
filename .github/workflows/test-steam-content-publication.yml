name: Verify Steam content publication
on:
  push:
    paths:
      - "content_backend/**"
      - ".github/workflows/steam-content-enrichment-dispatch.yml"
      - ".github/workflows/test-steam-content-publication.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r content_backend/requirements.txt
      - run: PYTHONPATH=content_backend python -m unittest -q content_backend/test_enrich_game.py
