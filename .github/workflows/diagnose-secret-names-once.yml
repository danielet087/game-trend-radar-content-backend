name: Diagnose content backend secret names once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-secret-names-once.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence only
        env:
          HAS_FRONTEND: ${{ secrets.FRONTEND_REPO_TOKEN != '' }}
          HAS_CONTENT: ${{ secrets.CONTENT_BACKEND_TOKEN != '' }}
        run: |
          echo "FRONTEND_REPO_TOKEN_PRESENT=$HAS_FRONTEND"
          echo "CONTENT_BACKEND_TOKEN_PRESENT=$HAS_CONTENT"
